name: Build NEXUS APK

on:
  push:
    branches: ["*"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and SDK components
        run: |
          sdkmanager --install \
            "ndk;27.2.12479018" \
            "cmake;3.22.1" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Clone llama.cpp
        run: |
          mkdir -p external
          git clone --depth 1 --branch b8662 --recurse-submodules --shallow-submodules \
            https://github.com/ggml-org/llama.cpp.git external/llama.cpp

      - name: Download sherpa-onnx Android libs (TTS)
        run: |
          SHERPA_VERSION="1.12.34"
          wget -q "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${SHERPA_VERSION}/sherpa-onnx-v${SHERPA_VERSION}-android.tar.bz2"
          tar xjf "sherpa-onnx-v${SHERPA_VERSION}-android.tar.bz2"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp jniLibs/arm64-v8a/libsherpa-onnx-jni.so app/src/main/jniLibs/arm64-v8a/
          cp jniLibs/arm64-v8a/libonnxruntime.so app/src/main/jniLibs/arm64-v8a/
          rm -rf jniLibs "sherpa-onnx-v${SHERPA_VERSION}-android.tar.bz2"
          ls -la app/src/main/jniLibs/arm64-v8a/

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew assembleDebug -PcmakeArgs="-DNEXUS_VULKAN=OFF"

      - name: Build Release APK (unsigned)
        run: ./gradlew assembleRelease -PcmakeArgs="-DNEXUS_VULKAN=OFF"
        continue-on-error: true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nexus-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: nexus-debug-${{ github.sha }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: app-debug.apk
          generate_release_notes: true
